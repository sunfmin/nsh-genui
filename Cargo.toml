[package]
name = "nsh-genui"
version = "0.1.0"
edition = "2024"
publish = false
description = "A Mac app whose UI DeepSeek writes at run time, rendered natively by NSH in a sandbox."

[workspace]

# NSH's crates, at the version of the installed `nsh` CLI (0.4.0).
[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
nsh-engine = "0.4.0"
nsh-js = "0.4.0"
# Only `compile_module`: one TSX module to the JS the runtime runs, no rolldown.
nsh-bundler = { version = "0.4.0", default-features = false }
nsh-platform-macos = "0.4.0"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
env_logger = "0.11"
log = "0.4"
regex = "1"
security-framework = "3"
# Development controls (`src/dev.rs`): the main queue, for screenshots.
dispatch2 = "0.3"

[dev-dependencies]
# Headless NSH engines: generated modules run and pressed without a window (tests/).
nsh-testing = "0.4.0"
